[mod-setting-name]
infinite-belt-stacking-inserter-hand-stack-max-sprites=Inserter hand stack max sprites

[mod-setting-description]
infinite-belt-stacking-inserter-hand-stack-max-sprites=Maximum number of item sprites an inserter hand will draw while holding a stack of items. Lowering this value improves performance but makes items on inserter hands look less numerous. Cannot exceed the maximum belt stack size.
